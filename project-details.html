<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Details — Saeed Nesai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>
  (function(){ var t = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-theme', t); })();
</script>
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">Saeed Nesai</a>
    <div class="header-controls">
      <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" class="lang-btn" data-lang="en">EN</button>
        <button type="button" class="lang-btn" data-lang="fa">FA</button>
        <button type="button" class="lang-btn" data-lang="pt">PT</button>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
        <svg class="icon-sun" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="section">
  <div class="wrap" style="max-width:760px">
    <p><a href="index.html#projects" class="link-quiet" id="back-link">← Back</a></p>
    <div class="card-media" style="aspect-ratio:16/9;border-radius:var(--radius);margin-bottom:28px" id="detail-media"></div>
    <div class="project-tag" id="detail-tag" style="font-size:.85rem"></div>
    <h1 id="detail-title" style="font-family:var(--font-head);font-size:2rem;margin-bottom:.6em"></h1>
    <div id="detail-body"></div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <p id="footer-copy">© 2016–2026 Saeed Nesai</p>
    <a href="https://www.linkedin.com/in/saeednesai/" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</footer>

<script src="data.js"></script>
<script>
  const themeToggle = document.getElementById('theme-toggle');
  function applyTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('theme', theme);
  }
  themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    applyTheme(cur === 'dark' ? 'light' : 'dark');
  });

  function coverSVG(type){
    const w=400,h=225;
    return `<svg viewBox="0 0 ${w} ${h}"><rect width="${w}" height="${h}" fill="var(--surface-alt)"/>
      <circle cx="${w/2}" cy="${h/2}" r="60" class="cover-a" fill="none" stroke-width="2"/></svg>`;
  }

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  let lang = params.get('lang') || localStorage.getItem('lang') || 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('is-active', btn.getAttribute('data-lang') === lang);
    btn.addEventListener('click', () => {
      lang = btn.getAttribute('data-lang');
      localStorage.setItem('lang', lang);
      render();
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('is-active', b === btn));
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    });
  });

  function render(){
    const item = projects.find(p => p.id === id);
    const backLabel = (translations[lang] && translations[lang].back_home) || translations.en.back_home;
    document.getElementById('back-link').textContent = backLabel;
    if (!item){
      document.getElementById('detail-title').textContent = 'Not found';
      return;
    }
    document.title = item.title[lang] + ' — Saeed Nesai';
    document.getElementById('detail-media').innerHTML = coverSVG(item.cover);
    document.getElementById('detail-tag').textContent = item.tag[lang];
    document.getElementById('detail-title').textContent = item.title[lang];
    document.getElementById('detail-body').innerHTML = item.detail[lang].map(p => `<p>${p}</p>`).join('');
    document.getElementById('footer-copy').textContent = (translations[lang] && translations[lang].footer_copy) || translations.en.footer_copy;
  }
  render();
</script>
</body>
</html>
