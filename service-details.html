<script src="data.js"></script>
<script>
  const themeToggle = document.getElementById('theme-toggle');
  themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });

  const SERVICE_LABEL = { en: 'Service', fa: 'خدمت', pt: 'Serviço' };

  const params = new URLSearchParams(location.search);
  const id = params.get('id');
  let lang = params.get('lang') || localStorage.getItem('lang') || 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.classList.toggle('is-active', btn.getAttribute('data-lang') === lang);
    btn.addEventListener('click', () => {
      lang = btn.getAttribute('data-lang');
      localStorage.setItem('lang', lang);
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('is-active', b === btn));
      render();
    });
  });

  function render(){
    const idx = services.findIndex(s => s.id === id);
    const item = services[idx];
    const tr = translations[lang] || translations.en;

    document.getElementById('back-link').textContent = tr.back_home || translations.en.back_home;
    document.getElementById('related-title').textContent = tr.services_title || translations.en.services_title;
    document.getElementById('footer-copy').textContent = tr.footer_copy || translations.en.footer_copy;
    document.getElementById('detail-category-label').textContent = SERVICE_LABEL[lang] || SERVICE_LABEL.en;

    if (!item){
      document.getElementById('detail-title').textContent = 'Not found';
      return;
    }

    document.title = item.title[lang] + ' — Saeed Nesai';
    document.getElementById('detail-media').innerHTML = coverSVG(item.cover);
    document.getElementById('detail-title').textContent = item.title[lang];
    document.getElementById('detail-body').innerHTML = item.detail[lang].map(p => `<p>${p}</p>`).join('');

    const prev = services[(idx - 1 + services.length) % services.length];
    const next = services[(idx + 1) % services.length];
    document.getElementById('pager-prev').href = `service-details.html?id=${prev.id}&lang=${lang}`;
    document.getElementById('pager-next').href = `service-details.html?id=${next.id}&lang=${lang}`;
    document.getElementById('pager-prev').setAttribute('aria-label', (tr.back_home ? '' : '') + prev.title[lang]);
    document.getElementById('pager-next').setAttribute('aria-label', next.title[lang]);
    document.getElementById('pager-prev').title = prev.title[lang];
    document.getElementById('pager-next').title = next.title[lang];

    document.getElementById('related-grid').innerHTML = services.filter(s => s.id !== item.id).map(s => `
      <a class="related-mini" href="service-details.html?id=${s.id}&lang=${lang}">
        ${coverSVG(s.cover)}
        <div class="related-mini-overlay"><span>${s.title[lang]}</span></div>
      </a>`).join('');
  }
  render();
</script>
