<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saeed Nesai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script>(function(){ var t = localStorage.getItem('theme') || 'light'; document.documentElement.setAttribute('data-theme', t); })();</script>
<style>
  body{display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .qr-card{max-width:380px;width:100%;text-align:center}
  .qr-avatar{
    width:76px;height:76px;border-radius:50%;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    background:var(--accent);color:#fff;font-family:var(--font-head);font-size:1.6rem;font-weight:700;
  }
  .qr-card h1{font-size:1.5rem;margin-bottom:.2em}
  .qr-role{color:var(--text-muted);font-size:.95rem;margin-bottom:1.8em}
  .qr-actions{display:flex;flex-direction:column;gap:10px}
  .qr-btn{
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:13px 18px;border-radius:8px;text-decoration:none;font-weight:600;font-size:.95rem;
    border:1px solid var(--border);color:var(--text);background:var(--surface);
  }
  .qr-btn svg{width:18px;height:18px;flex-shrink:0}
  .qr-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .qr-site-link{display:inline-block;margin-top:1.8em;color:var(--text-muted);font-size:.88rem;text-decoration:underline;text-underline-offset:3px}
  .qr-theme-toggle{position:fixed;top:18px;inset-inline-end:18px;background:none;border:1px solid var(--border);border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--text);cursor:pointer}
  .qr-theme-toggle .icon-moon{display:none}
  [data-theme="dark"] .qr-theme-toggle .icon-sun{display:none}
  [data-theme="dark"] .qr-theme-toggle .icon-moon{display:block}
</style>
</head>
<body>

<button type="button" class="qr-theme-toggle" id="theme-toggle" aria-label="Toggle dark mode">
  <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
</button>

<div class="qr-card">
  <div class="qr-avatar">SN</div>
  <h1>Saeed Nesai</h1>
  <p class="qr-role">Software Engineer</p>

  <div class="qr-actions">
    <a class="qr-btn primary" href="saeed-nesai.vcf" download>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
      Save contact
    </a>
    <a class="qr-btn" href="tel:+989158828288">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .3 2 .7 3a2 2 0 0 1-.4 2.1L8 10.2a16 16 0 0 0 6 6l1.4-1.4a2 2 0 0 1 2.1-.4c1 .4 2 .6 3 .7a2 2 0 0 1 1.5 2.8z"/></svg>
      Call
    </a>
    <a class="qr-btn" href="https://wa.me/989158828288" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12.4 7.6L3 20l1-5.3A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.5 10.5c.3 2.3 2.2 4.2 4.5 4.5"/></svg>
      WhatsApp
    </a>
    <a class="qr-btn" href="mailto:saeed.nesai@gmail.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      Email
    </a>
    <a class="qr-btn" href="https://www.linkedin.com/in/saeednesai/" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/><path d="M10 9v12M10 13a4 4 0 0 1 8 0v8"/></svg>
      LinkedIn
    </a>
  </div>

  <a class="qr-site-link" href="index.html">Visit full site →</a>
</div>

<script>
  const themeToggle = document.getElementById('theme-toggle');
  themeToggle.addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  });
</script>
</body>
</html>
